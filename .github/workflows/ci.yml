name: Local-equivalent checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Same Linux release gate as local
        run: node scripts/check-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-coverage
          path: |
            coverage/browser-summary.json
            coverage/checks/
            test-results/
          retention-days: 7
