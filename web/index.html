<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><title>Whisper.</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a class="brand" href="/" aria-label="Whisper."><svg class="brand-mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M6 12c4 0 4 25 11 25s7-23 12-23 4 23 11 23 7-25 12-25"/><circle cx="59" cy="36" r="2.5"/></svg></a><div class="header-actions"><button id="theme-toggle" class="icon-button" type="button" aria-label="Theme" aria-pressed="false"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button id="copy-draft" class="icon-button" type="button" data-i18n-aria-label="copy" data-i18n-title="copy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 5V3H3v13h2"/></svg></button><div class="language-control"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2m4 0c-1 6-5 10-10 12m2-9c1 4 4 7 8 9m1 3 4-10 4 10m-6-3h4"/></svg><label class="sr-only" for="language" data-i18n="language"></label><select id="language" data-i18n-aria-label="language" data-i18n-title="language"><option value="auto" data-i18n="system"></option></select></div><nav id="compose-actions"><div class="mode-switch" role="group" data-i18n-aria-label="message"><button id="text-mode" class="icon-button" type="button" data-i18n-aria-label="text" data-i18n-title="text" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M12 5v15M8 20h8"/></svg></button><button id="audio-mode" class="icon-button" type="button" data-i18n-aria-label="voice" data-i18n-title="voice" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2m-6 8v4m-4 0h8"/></svg></button></div></nav></div></header>
<main class="workspace">
<section id="compose"><h1 class="sr-only" data-i18n="newMessage"></h1><form id="compose-form"><div id="text-editor"><label for="message" id="message-label" class="sr-only" data-i18n="content"></label>
<div id="rich-toolbar" class="toolbar" role="toolbar" data-i18n-aria-label="format" hidden><button type="button" data-command="bold" data-i18n-aria-label="bold"><strong>B</strong></button><button type="button" data-command="italic" data-i18n-aria-label="italic"><em>I</em></button><button type="button" data-command="underline" data-i18n-aria-label="underline"><u>U</u></button><button type="button" data-command="insertUnorderedList" data-i18n="list"></button><button type="button" data-command="removeFormat" data-i18n="clearFormat"></button></div>
<textarea id="message" data-i18n-aria-label="content" data-i18n-placeholder="write" maxlength="262144" autocomplete="off" spellcheck="false"></textarea><div id="rich-editor" contenteditable="true" role="textbox" data-i18n-aria-label="content" aria-multiline="true" spellcheck="false" hidden></div></div>
<div id="voice-stage" hidden><p id="voice-instruction" data-i18n="hold"></p><div id="voice-preview" hidden></div><div class="voice-actions"><button id="delete-recording" type="button" data-i18n="again" hidden></button><button id="share-recording" type="button" class="primary" data-i18n="shareVoice" hidden></button></div></div>
</form></section>
<section id="created" hidden><h1 data-i18n="ready"></h1><p id="expiry" class="muted"></p><p id="link-reminder" class="muted" data-i18n="linkOnce"></p><label for="share-link" data-i18n="messageLink"></label><div class="copy-row"><input id="share-link" readonly autocomplete="off" dir="ltr"><button type="button" id="copy-link" data-i18n="copy"></button></div><div id="pin-result" hidden><label for="generated-pin" data-i18n="codeLabel"></label><div class="pin-row"><output id="generated-pin" dir="ltr"></output><button type="button" id="copy-pin" data-i18n="copyCode"></button></div></div><details class="revoke-block"><summary data-i18n="revokeEarly"></summary><label for="revoke-link" data-i18n="revokeLink"></label><div class="copy-row"><input id="revoke-link" readonly autocomplete="off" dir="ltr"><button type="button" id="copy-revoke" data-i18n="copy"></button></div></details><a class="text-link" href="/" data-i18n="newMessage"></a></section>
<section id="receive" hidden><h1 data-i18n="open"></h1><p id="receive-note" class="muted" data-i18n="checking"></p><form id="open-form"><label for="pin" data-i18n="pinLabel"></label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" data-i18n-placeholder="pinPlaceholder"><button type="submit" id="open" class="primary" data-i18n="open"></button></form></section>
<section id="reading" hidden><div class="reading-heading"><h1 data-i18n="message"></h1><button id="copy-all" type="button" data-i18n="copyAll"></button></div><div id="plaintext" class="message-content"></div><div id="received-audio" hidden></div><div class="selection-actions"><button id="copy-selection" type="button" data-i18n="copySelection" hidden></button></div><button id="clear" type="button" class="primary" data-i18n="closeMessage"></button></section>
<section id="destroy" hidden><h1 data-i18n="revokeQuestion"></h1><p class="muted" data-i18n="irreversible"></p><button id="revoke" class="primary danger" type="button" data-i18n="revokeNow"></button></section>
<section id="ended" hidden><h1 data-i18n="closed"></h1><p id="ended-note" class="muted"></p><a href="/" class="text-link" data-i18n="newMessage"></a></section>
</main>
<aside id="share-dock" class="share-dock"><p id="watcher-line" class="watcher-line" aria-live="off"></p><div id="recording-wave" class="recording-thought" hidden><div id="live-wave" class="voice-wave" aria-hidden="true"></div><output id="recording-time">0:00</output></div><button id="create" class="eyt" type="button" data-i18n-aria-label="create" aria-haspopup="dialog" aria-controls="settings"></button></aside>
<p id="status" role="status" aria-live="polite"></p>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title" data-i18n="settings"></h2><button id="settings-close" type="button" class="icon-button" data-i18n-aria-label="close">×</button></div><div class="options"><div class="expiry-row"><label for="ttl" data-i18n="expires"></label><select id="ttl"><option value="600" data-i18n="m10"></option><option value="3600" data-i18n="h1"></option><option value="86400" selected data-i18n="h24"></option><option value="604800" data-i18n="d7"></option><option value="custom" data-i18n="custom"></option></select></div><div id="custom-expiry" class="expiry-row" hidden><label for="ttl-minutes" data-i18n="minutes"></label><input id="ttl-minutes" type="number" min="1" max="10080" step="1" value="30"></div><label class="inline"><input type="checkbox" id="burn" checked><span data-i18n="oneRead"></span></label><label class="inline"><input type="checkbox" id="use-pin"><span data-i18n="addCode"></span></label><label class="inline" id="format-option"><input id="rich-mode" type="checkbox"><span data-i18n="format"></span></label></div><p id="count" class="muted"></p><details><summary data-i18n="privacy"></summary><p data-i18n="privacyNote"></p></details>
<div id="verification"><p id="challenge-label" class="challenge-label" aria-live="polite" data-i18n="preparing"></p><div id="desktop-challenge" class="wks"><div id="wake-track" class="wks-track" role="slider" tabindex="0" aria-labelledby="challenge-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-describedby="challenge-label"></div><output id="wake-value">0</output></div><div id="mobile-challenge" class="sld" hidden><div id="slide-track" class="sld-track"><i class="sld-wash" aria-hidden="true"></i><span class="sld-say" data-i18n="slide"></span><button type="button" class="sld-grip" data-i18n-aria-label="slide"><span class="sld-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></span><span class="sld-done" data-i18n="confirmed" hidden></span></button></div></div><p id="verification-note" role="status"></p><button id="challenge-retry" type="button" data-i18n="again" hidden></button></div><button id="settings-done" class="primary" type="button" data-i18n="create" disabled></button></dialog>
</body></html>
